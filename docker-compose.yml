name: rent-utility-billing

services:
  billing:
    image: ${IMAGE:-rent-utility-billing:1.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 网络受限时可在 .env 里改成镜像站前缀，如 docker.m.daocloud.io/library/node:24-alpine
        BASE_IMAGE: ${BASE_IMAGE:-node:24-alpine}
    container_name: rent-utility-billing
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 放在 Nginx/Caddy 后面时设为 1，用 X-Forwarded-For 识别真实 IP
      TRUST_PROXY: ${TRUST_PROXY:-}
      # 应急兜底密码（正常请在网页「设置」里设置访问密码，密码存 ./data/config.json）
      APP_PASSWORD: ${APP_PASSWORD:-}
    # 用宿主机当前用户的 uid/gid 运行，./data 目录不会被容器改成别的属主
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # 数据库、密码配置、备份都保存在宿主机 ./data，删容器不丢数据
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
